<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nimbli</title>
    <script>
      (function () {
        var path = location.pathname + location.search + location.hash;
        if (path !== "/") {
          location.replace("/" + (path.charAt(0) === "/" ? path.slice(1) : path));
        }
      })();
    </script>
  </head>
  <body></body>
</html>
